<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>Für Pepsi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="unlock.css" />
</head>
<body>
  <main class="stage">
    <button class="envelope" id="open" type="button" aria-label="Brief öffnen">
      <span class="flap"></span>
      <span class="seal">P</span>
    </button>
    <p class="hint">Für Pepsi · Tippe, um zu öffnen</p>
    
    <form id="unlock" class="unlock" hidden>
      <p class="eyebrow">Ein kleiner Schlüssel</p>
      <h1>Nur für<br><em>Pepsi.</em></h1>
      <p>Gib den kleinen Code ein, dann öffnet sich das Pepsiversum.</p>
      <label for="passphrase">Code</label>
      <input id="passphrase" type="password" autocomplete="off" required />
      <p class="error" id="error" aria-live="polite"></p>
      <button>Pepsiversum betreten →</button>
    </form>
  </main>
  <script src="unlock.js"></script>
</body>
</html>
