<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>Für Pepsi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="unlock.css" />
</head>
<body>
  <div class="ambient-stars" aria-hidden="true"></div>
  
  <main class="gate-stage">
    
    <div class="orb-container" id="orb-trigger" tabindex="0" role="button" aria-label="Universum betreten">
      <div class="pulse-ring"></div>
      <div class="glowing-orb"></div>
      <p class="hint-text">Tippe, um das Universum zu betreten</p>
    </div>

    <form id="unlock" class="unlock-card" hidden>
      <div class="card-header">
        <p class="eyebrow">Ein digitaler Schlüssel</p>
        <h1>Nur für<br><em>Pepsi.</em></h1>
      </div>
      <p class="desc">Gib unseren kleinen Code ein, um die Erinnerungen zu entsperren.</p>
      
      <div class="input-group">
        <label for="passphrase">Passwort</label>
        <input id="passphrase" type="password" autocomplete="off" required />
      </div>
      
      <p class="error" id="error" aria-live="polite"></p>
      <button class="submit-btn" type="submit">Eintreten ✨</button>
    </form>
    
  </main>
  
  <script src="unlock.js"></script>
</body>
</html>
